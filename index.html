<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>المنيو الإلكتروني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brown-dark:#2E1B10;
  --brown:#6B4226;
  --brown-light:#8A5A34;
  --gold:#C9973F;
  --gold-light:#E4Bancy;
  --gold2:#E6B65C;
  --cream:#FBF3E7;
  --cream2:#F3E5D0;
  --white:#FFFFFF;
  --danger:#B3413A;
  --success:#4C7A4C;
  --text:#3A281C;
  --muted:#8A7562;
  --radius:14px;
  --shadow:0 6px 20px rgba(59,36,23,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--cream);
  color:var(--text);
  min-height:100vh;
  direction:rtl;
}
h1,h2,h3,h4,.brand{font-family:'Cairo',sans-serif;font-weight:700}
button{font-family:'Tajawal',sans-serif;cursor:pointer;border:none}
input,select,textarea{font-family:'Tajawal',sans-serif}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* ---------- Utility ---------- */
.hidden{display:none !important}
.container{max-width:1100px;margin:0 auto;padding:0 16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:10px;font-weight:700;font-size:15px;
  transition:.15s transform,.15s box-shadow,.15s background;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--brown-dark);box-shadow:0 4px 14px rgba(201,151,63,.35)}
.btn-primary:hover{box-shadow:0 6px 18px rgba(201,151,63,.5)}
.btn-outline{background:transparent;border:1.5px solid var(--brown);color:var(--brown)}
.btn-danger{background:#fbeceb;color:var(--danger)}
.btn-success{background:#eaf3ea;color:var(--success)}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}
.btn-icon{padding:8px;border-radius:8px;background:var(--cream2)}
.link-btn{background:none;color:var(--brown);font-weight:700;text-decoration:underline;padding:4px}

.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:6px;font-weight:700;font-size:14px;color:var(--brown-dark)}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #e6d9c4;
  background:#fffefb;font-size:15px;color:var(--text);outline:none;transition:.15s border-color;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field-hint{font-size:12px;color:var(--muted);margin-top:4px}
.field-row{display:flex;gap:12px}
.field-row .field{flex:1}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.switch{position:relative;width:46px;height:26px;background:#e6d9c4;border-radius:20px;transition:.2s;flex-shrink:0}
.switch.on{background:var(--gold)}
.switch::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{right:23px}

/* ---------- Auth screens ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(circle at 20% 20%, rgba(201,151,63,.15), transparent 40%),
  radial-gradient(circle at 80% 80%, rgba(107,66,38,.12), transparent 40%), var(--cream);}
.auth-box{width:100%;max-width:420px}
.auth-logo{text-align:center;margin-bottom:22px}
.auth-logo .icon{font-size:42px}
.auth-logo h1{font-size:24px;color:var(--brown-dark);margin-top:6px}
.auth-logo p{font-size:13px;color:var(--muted);margin-top:4px}
.auth-tabs-foot{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.pending-box{text-align:center;padding:40px 24px}
.pending-box .icon{font-size:48px;margin-bottom:14px}
.error-box{text-align:center;padding:40px 24px}

/* ---------- Toast ---------- */
#toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px)}
.toast{
  padding:13px 18px;border-radius:10px;font-size:14px;font-weight:700;color:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.18);animation:toastIn .25s ease;text-align:center;
}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--brown)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* ---------- Dashboard shell ---------- */
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--brown-dark);color:var(--cream);padding:14px 0;position:sticky;top:0;z-index:50}
.topbar .container{display:flex;align-items:center;justify-content:space-between}
.topbar .brand{color:var(--gold2);font-size:19px;display:flex;align-items:center;gap:8px}
.topbar .store-name{font-size:12px;color:#cbb89a}
.topbar-actions{display:flex;align-items:center;gap:10px}
.logout-btn{background:rgba(255,255,255,.08);color:var(--cream);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700}

.tabbar{background:var(--white);border-bottom:1px solid #eee0cc;position:sticky;top:57px;z-index:40;overflow-x:auto}
.tabbar .container{display:flex;gap:4px}
.tab-btn{padding:14px 18px;font-size:14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;background:transparent}
.tab-btn.active{color:var(--brown-dark);border-color:var(--gold)}

.main-content{flex:1;padding:22px 0 60px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.section-head h2{font-size:19px;color:var(--brown-dark)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state .icon{font-size:38px;margin-bottom:10px}

/* Products table/cards */
.data-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.item-card{background:var(--white);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.item-card .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--cream2)}
.item-card .thumb-empty{width:100%;aspect-ratio:4/3;background:var(--cream2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:30px}
.item-card .body{padding:12px;flex:1;display:flex;flex-direction:column;gap:4px}
.item-card .name{font-weight:700;font-size:15px;color:var(--brown-dark)}
.item-card .cat{font-size:12px;color:var(--muted)}
.item-card .price-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.price-now{font-weight:800;color:var(--brown)}
.price-old{font-size:12px;color:var(--muted);text-decoration:line-through}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:700}
.badge-on{background:#eaf3ea;color:var(--success)}
.badge-off{background:#f2e6e6;color:var(--danger)}
.item-actions{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #f0e6d5}
.item-actions .btn{flex:1}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:8px 14px;border-radius:20px;background:var(--white);border:1.5px solid #e6d9c4;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.chip .x{color:var(--danger);font-weight:900;padding:0 2px}

/* Orders */
.order-card{background:var(--white);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border-inline-start:5px solid var(--gold)}
.order-card.done{border-inline-start-color:var(--success);opacity:.75}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.order-head .name{font-weight:800;color:var(--brown-dark)}
.order-head .time{font-size:12px;color:var(--muted)}
.order-items{font-size:13px;color:var(--text);margin:8px 0;line-height:1.9}
.order-total{font-weight:800;color:var(--brown);margin-top:6px}
.order-actions{display:flex;gap:8px;margin-top:12px}

/* Settings */
.qr-box{text-align:center;padding:16px;background:var(--cream2);border-radius:12px}
.link-copy-row{display:flex;gap:8px;align-items:center;background:var(--cream2);padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px;word-break:break-all}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(46,27,16,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-box{background:var(--white);border-radius:16px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:22px}
.modal-box h3{margin-bottom:16px;color:var(--brown-dark)}
.modal-close{float:left;font-size:22px;color:var(--muted);background:none;padding:4px}
.img-upload{border:2px dashed #dcc9a8;border-radius:12px;padding:14px;text-align:center;cursor:pointer;background:var(--cream2);position:relative}
.img-upload img{max-height:140px;margin:0 auto;border-radius:8px}
.img-upload .hint{font-size:12px;color:var(--muted);margin-top:6px}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(0,0,0,.15);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--brown)}
.loading-screen .big-spinner{width:40px;height:40px;border:4px solid #e6d9c4;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}

/* ---------- Public menu ---------- */
.pm-banner{position:relative;height:230px;background:linear-gradient(135deg,var(--brown),var(--brown-dark));background-size:cover;background-position:center}
.pm-banner .overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,.05))}
.pm-banner .pm-store-info{position:absolute;bottom:16px;right:16px;left:16px;color:#fff}
.pm-store-info h1{font-size:22px}
.pm-wa-btn{position:absolute;top:16px;left:16px;background:#25D366;color:#fff;padding:10px 14px;border-radius:24px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.25)}

.pm-offers{padding:16px 0;overflow-x:auto}
.pm-offers .row{display:flex;gap:12px;padding:0 16px}
.offer-card{min-width:230px;background:linear-gradient(135deg,var(--gold2),var(--gold));border-radius:14px;padding:14px;color:var(--brown-dark);flex-shrink:0}
.offer-card img{width:100%;height:100px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.offer-card .title{font-weight:800;font-size:15px}
.offer-card .desc{font-size:12px;opacity:.85;margin:4px 0}
.offer-card .prices{display:flex;gap:8px;align-items:center}

.pm-cats{position:sticky;top:0;background:var(--cream);z-index:30;padding:12px 0;overflow-x:auto;border-bottom:1px solid #ecdfc7}
.pm-cats .row{display:flex;gap:8px;padding:0 16px}
.cat-pill{padding:9px 18px;border-radius:20px;background:var(--white);font-size:14px;font-weight:700;white-space:nowrap;border:1.5px solid #e6d9c4;color:var(--text)}
.cat-pill.active{background:var(--brown);color:#fff;border-color:var(--brown)}

.pm-products{padding:18px 16px 100px}
.pm-cat-title{font-size:17px;font-weight:800;color:var(--brown-dark);margin:18px 0 10px}
.pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pm-product{background:var(--white);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.pm-product .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--cream2)}
.pm-product .thumb-empty{width:100%;aspect-ratio:1/1;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted)}
.pm-product .body{padding:10px;flex:1;display:flex;flex-direction:column;gap:4px}
.pm-product .name{font-weight:700;font-size:14px}
.pm-product .desc{font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm-product .foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.qty-add{background:var(--gold);color:var(--brown-dark);width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:800}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--cream2);border-radius:20px;padding:2px}
.qty-ctrl button{width:28px;height:28px;border-radius:50%;background:var(--white);font-weight:800;font-size:16px}
.qty-ctrl span{font-weight:700;min-width:16px;text-align:center}

.pm-empty-menu{text-align:center;padding:60px 20px;color:var(--muted)}

.cart-bar{position:fixed;bottom:14px;right:16px;left:16px;max-width:460px;margin:0 auto;background:var(--brown-dark);color:#fff;border-radius:16px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:80;cursor:pointer}
.cart-bar .count{background:var(--gold);color:var(--brown-dark);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-left:8px}

.cart-modal .cart-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0e6d5}
.cart-line .cl-name{font-weight:700;font-size:14px}
.cart-line .cl-price{font-size:12px;color:var(--muted)}
.cart-summary-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.cart-summary-row.total{font-weight:800;font-size:16px;border-top:1.5px solid #e6d9c4;padding-top:10px;margin-top:6px}
.order-type-toggle{display:flex;gap:8px;margin-bottom:14px}
.order-type-toggle button{flex:1;padding:12px;border-radius:10px;border:1.5px solid #e6d9c4;background:var(--white);font-weight:700}
.order-type-toggle button.active{background:var(--brown);color:#fff;border-color:var(--brown)}

.success-check{text-align:center;padding:20px}
.success-check .icon{font-size:52px;color:var(--success);margin-bottom:10px}

@media (max-width:600px){
  .auth-box{max-width:100%}
  .modal-box{padding:16px}
}
</style>
</head>
<body>

<div id="toast-container"></div>

<div id="app-root">
  <div class="loading-screen" id="global-loading">
    <div class="big-spinner"></div>
    <div>جاري التحميل...</div>
  </div>
</div>

<!-- ============ Templates (cloned via JS) ============ -->

<template id="tpl-fatal-error">
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="card error-box">
        <div class="icon">⚠️</div>
        <h2>حدث خطأ في تحميل التطبيق</h2>
        <p style="margin-top:10px;color:var(--muted)" id="fatal-error-msg"></p>
      </div>
    </div>
  </div>
</template>

<template id="tpl-login">
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="icon">☕</div>
        <h1>المنيو الإلكتروني</h1>
        <p>سجّل دخولك لإدارة منيو مطعمك</p>
      </div>
      <div class="card">
        <form id="login-form">
          <div class="field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="login-email" required autocomplete="email">
          </div>
          <div class="field">
            <label>كلمة السر</label>
            <input type="password" id="login-password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">
            <span class="btn-label">تسجيل الدخول</span>
          </button>
        </form>
        <div class="auth-tabs-foot">
          <button class="link-btn" data-nav="forgot">نسيت كلمة السر؟</button>
        </div>
      </div>
      <div class="auth-tabs-foot">
        ليس لديك حساب؟ <button class="link-btn" data-nav="register">إنشاء حساب جديد</button>
      </div>
    </div>
  </div>
</template>

<template id="tpl-register">
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="icon">☕</div>
        <h1>إنشاء حساب جديد</h1>
        <p>ابدأ في إدارة منيو مطعمك إلكترونيًا</p>
      </div>
      <div class="card">
        <form id="register-form">
          <div class="field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="reg-email" required autocomplete="email">
          </div>
          <div class="field">
            <label>رقم الواتساب</label>
            <input type="tel" id="reg-whatsapp" placeholder="مثال: 201012345678" required>
            <div class="field-hint">بالصيغة الدولية بدون + أو أصفار في البداية</div>
          </div>
          <div class="field">
            <label>كلمة السر</label>
            <input type="password" id="reg-password" required minlength="6" autocomplete="new-password">
          </div>
          <div class="field">
            <label>تأكيد كلمة السر</label>
            <input type="password" id="reg-password2" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="register-submit-btn">
            <span class="btn-label">إنشاء الحساب</span>
          </button>
        </form>
      </div>
      <div class="auth-tabs-foot">
        لديك حساب بالفعل؟ <button class="link-btn" data-nav="login">تسجيل الدخول</button>
      </div>
    </div>
  </div>
</template>

<template id="tpl-forgot">
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="icon">🔑</div>
        <h1>استعادة كلمة السر</h1>
        <p>سنرسل لك رابط إعادة التعيين على بريدك</p>
      </div>
      <div class="card">
        <form id="forgot-form">
          <div class="field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="forgot-email" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="forgot-submit-btn">
            <span class="btn-label">إرسال رابط الاستعادة</span>
          </button>
        </form>
      </div>
      <div class="auth-tabs-foot">
        <button class="link-btn" data-nav="login">الرجوع لتسجيل الدخول</button>
      </div>
    </div>
  </div>
</template>

<template id="tpl-pending">
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="card pending-box">
        <div class="icon">⏳</div>
        <h2>حسابك قيد المراجعة</h2>
        <p style="margin-top:10px;color:var(--muted);line-height:1.8">
          تم إنشاء حسابك بنجاح، لكنه لسه محتاج تفعيل من فريق الإدارة قبل ما تقدر تدخل لوحة التحكم.
          هيتم التواصل معاك قريبًا.
        </p>
        <button class="btn btn-outline" style="margin-top:20px" id="pending-logout-btn">تسجيل الخروج</button>
      </div>
    </div>
  </div>
</template>

<!-- Dashboard shell -->
<template id="tpl-dashboard">
  <div class="app-shell">
    <div class="topbar">
      <div class="container">
        <div>
          <div class="brand">☕ المنيو الإلكتروني</div>
          <div class="store-name" id="topbar-store-name"></div>
        </div>
        <div class="topbar-actions">
          <button class="logout-btn" id="dash-logout-btn">تسجيل الخروج</button>
        </div>
      </div>
    </div>
    <div class="tabbar">
      <div class="container">
        <button class="tab-btn" data-tab="products">المنتجات</button>
        <button class="tab-btn" data-tab="offers">العروض</button>
        <button class="tab-btn" data-tab="orders">الطلبات</button>
        <button class="tab-btn" data-tab="settings">الإعدادات</button>
      </div>
    </div>
    <div class="main-content container" id="tab-content"></div>
  </div>
</template>

<!-- Public menu -->
<template id="tpl-public-menu">
  <div id="pm-root">
    <div class="pm-banner" id="pm-banner">
      <div class="overlay"></div>
      <a class="pm-wa-btn" id="pm-wa-btn" target="_blank" rel="noopener">💬 واتساب</a>
      <div class="pm-store-info">
        <h1 id="pm-store-title"></h1>
      </div>
    </div>
    <div id="pm-offers-wrap"></div>

      </div>

<script>
/* =========================================================================
   المنيو الإلكتروني — تطبيق إدارة منيو رقمي (Single File / Supabase)
   ========================================================================= */

/* ---------------------- 1. إعداد Supabase ---------------------- */
// عدّل القيم دي ببيانات مشروعك في Supabase (Settings > API)
const SUPABASE_URL = 'https://stqhzgbayuyebcnfhgeq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__06Wj_8PoScNfG4YTAUuYQ_Z-mDGs8u';

const BUCKET_NAME = 'menu-images';
const MAX_IMAGE_MB = 5;

let supabaseClient = null;
let currentSession = null;
let currentStore = null;   // صف صاحب المتجر في لوحة التحكم
let activeTab = 'products';
let ordersChannel = null;

// حالة صفحة المنيو العامة
let pmStore = null;
let pmStoreId = null;
let pmActiveCategory = 'all';
let cart = []; // [{product_id, name, price, qty}]
let pmOrderType = 'pickup';

/* ---------------------- 2. أدوات مساعدة عامة ---------------------- */

function $(sel, ctx){ return (ctx || document).querySelector(sel); }
function $all(sel, ctx){ return Array.from((ctx || document).querySelectorAll(sel)); }
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#39;');
}
function uid(){
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
}
function formatMoney(n){
  const num = Number(n) || 0;
  return num.toLocaleString('ar-EG', {maximumFractionDigits:2}) + ' ج.م';
}
function showToast(message, type){
  type = type || 'info';
  const container = $('#toast-container');
  const t = el('div', 'toast ' + type, escapeHtml(message));
  container.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity .3s';
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 300);
  }, 3200);
}
function setRoot(node){
  const root = $('#app-root');
  root.innerHTML = '';
  root.appendChild(node);
}
function renderTemplate(tplId){
  const tpl = document.getElementById(tplId);
  return tpl.content.cloneNode(true);
}
function setBtnLoading(btn, loading, loadingText){
  if (!btn) return;
  if (loading){
    btn.dataset.originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ' + (loadingText || 'جاري التحميل...');
  } else {
    btn.disabled = false;
    if (btn.dataset.originalHtml) btn.innerHTML = btn.dataset.originalHtml;
  }
}

/* ---------------------- 3. ترجمة رسائل الأخطاء لعربي ---------------------- */
function mapSupabaseError(error){
  if (!error) return 'حدث خطأ غير متوقع، حاول مرة أخرى';
  const raw = (error.message || error.error_description || error.msg || '').toLowerCase();

  const rules = [
    { m: 'invalid login credentials', ar: 'بيانات الدخول غير صحيحة، تأكد من البريد وكلمة السر' },
    { m: 'user already registered', ar: 'هذا البريد الإلكتروني مسجل بالفعل' },
    { m: 'already registered', ar: 'هذا البريد الإلكتروني مسجل بالفعل' },
    { m: 'email not confirmed', ar: 'لم يتم تأكيد البريد الإلكتروني بعد' },
    { m: 'password should be at least', ar: 'كلمة السر يجب أن تكون 6 أحرف على الأقل' },
    { m: 'password is too short', ar: 'كلمة السر يجب أن تكون 6 أحرف على الأقل' },
    { m: 'unable to validate email', ar: 'صيغة البريد الإلكتروني غير صحيحة' },
    { m: 'invalid email', ar: 'صيغة البريد الإلكتروني غير صحيحة' },
    { m: 'rate limit', ar: 'محاولات كثيرة جدًا، حاول مرة أخرى بعد قليل' },
    { m: 'too many requests', ar: 'محاولات كثيرة جدًا، حاول مرة أخرى بعد قليل' },
    { m: 'network', ar: 'تعذر الاتصال بالخادم، تحقق من الإنترنت' },
    { m: 'failed to fetch', ar: 'تعذر الاتصال بالخادم، تحقق من الإنترنت' },
    { m: 'jwt', ar: 'انتهت صلاحية الجلسة، سجّل الدخول من جديد' },
    { m: 'row-level security', ar: 'ليس لديك صلاحية للقيام بهذا الإجراء' },
    { m: 'permission denied', ar: 'ليس لديك صلاحية للقيام بهذا الإجراء' },
    { m: 'duplicate key', ar: 'هذا العنصر موجود بالفعل' },
    { m: 'file size', ar: 'حجم الملف أكبر من الحد المسموح (5 ميجابايت)' },
    { m: 'user not found', ar: 'لا يوجد حساب مرتبط بهذا البريد' },
  ];
  for (const r of rules){
    if (raw.includes(r.m)) return r.ar;
  }
  return error.message ? ('حدث خطأ: ' + error.message) : 'حدث خطأ غير متوقع، حاول مرة أخرى';
}

/* ---------------------- 4. بدء التشغيل ---------------------- */
document.addEventListener('DOMContentLoaded', init);

function init(){
  if (typeof window.supabase === 'undefined' || !window.supabase.createClient){
    const frag = renderTemplate('tpl-fatal-error');
    setRoot(frag);
    $('#fatal-error-msg').textContent = 'تعذر تحميل مكتبة Supabase (SDK). تأكد من اتصالك بالإنترنت ثم أعد تحميل الصفحة.';
    return;
  }

  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e){
    const frag = renderTemplate('tpl-fatal-error');
    setRoot(frag);
    $('#fatal-error-msg').textContent = 'تعذر إنشاء اتصال Supabase. تحقق من إعدادات SUPABASE_URL و SUPABASE_ANON_KEY داخل الكود.';
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const storeParam = params.get('store');

  if (storeParam){
    initPublicMenu(storeParam);
  } else {
    initAdminApp();
  }
}

/* =========================================================================
   5. تطبيق لوحة التحكم (Admin)
   ========================================================================= */

function initAdminApp(){
  supabaseClient.auth.onAuthStateChange((event, session) => {
    currentSession = session;
    handleAuthChange(session);
  });
  supabaseClient.auth.getSession().then(({ data }) => {
    currentSession = data.session;
    handleAuthChange(data.session);
  });
}

async function handleAuthChange(session){
  if (!session){
    renderLogin();
    return;
  }
  try {
    let { data: store, error } = await supabaseClient
      .from('stores')
      .select('*')
      .eq('id', session.user.id)
      .maybeSingle();

    if (error) throw error;

    if (!store){
      const whatsapp = session.user.user_metadata && session.user.user_metadata.whatsapp ? session.user.user_metadata.whatsapp : '';
      const { data: created, error: insErr } = await supabaseClient
        .from('stores')
        .insert({
          id: session.user.id,
          settings: {
            name: 'مطعمي',
            whatsapp: whatsapp,
            banner_url: '',
            delivery_enabled: false,
            delivery_fee: 0,
            min_order: 0
          },
          categories: [],
          products: [],
          offers: []
        })
        .select()
        .maybeSingle();
      if (insErr) throw insErr;
      store = created;
    }

    currentStore = store;

    if (!store.active){
      renderPending();
    } else {
      renderDashboard();
    }
  } catch (e){
    console.error(e);
    showToast(mapSupabaseError(e), 'error');
    renderLogin();
  }
}

function renderLogin(){
  const frag = renderTemplate('tpl-login');
  setRoot(frag);
  $('#login-form').addEventListener('submit', onLoginSubmit);
  $all('[data-nav]').forEach(b => b.addEventListener('click', () => navigateAuth(b.dataset.nav)));
}
function renderRegister(){
  const frag = renderTemplate('tpl-register');
  setRoot(frag);
  $('#register-form').addEventListener('submit', onRegisterSubmit);
  $all('[data-nav]').forEach(b => b.addEventListener('click', () => navigateAuth(b.dataset.nav)));
}
function renderForgot(){
  const frag = renderTemplate('tpl-forgot');
  setRoot(frag);
  $('#forgot-form').addEventListener('submit', onForgotSubmit);
  $all('[data-nav]').forEach(b => b.addEventListener('click', () => navigateAuth(b.dataset.nav)));
}
function renderPending(){
  const frag = renderTemplate('tpl-pending');
  setRoot(frag);
  $('#pending-logout-btn').addEventListener('click', doLogout);
}
function navigateAuth(target){
  if (target === 'login') renderLogin();
  else if (target === 'register') renderRegister();
  else if (target === 'forgot') renderForgot();
}

async function onLoginSubmit(ev){
  ev.preventDefault();
  const btn = $('#login-submit-btn');
  const email = $('#login-email').value.trim();
  const password = $('#login-password').value;
  setBtnLoading(btn, true, 'جاري الدخول...');
  try {
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    showToast('تم تسجيل الدخول بنجاح', 'success');
  } catch (e){
    showToast(mapSupabaseError(e), 'error');
  } finally {
    setBtnLoading(btn, false);
  }
}

async function onRegisterSubmit(ev){
  ev.preventDefault();
  const btn = $('#register-submit-btn');
  const email = $('#reg-email').value.trim();
  const whatsapp = $('#reg-whatsapp').value.trim();
  const password = $('#reg-password').value;
  const password2 = $('#reg-password2').value;

  if (password.length < 6){
    showToast('كلمة السر يجب أن تكون 6 أحرف على الأقل', 'error');
    return;
  }
  if (password !== password2){
    showToast('كلمتا السر غير متطابقتين', 'error');
    return;
  }
  if (!whatsapp){
    showToast('من فضلك أدخل رقم الواتساب', 'error');
    return;
  }

  setBtnLoading(btn, true, 'جاري الإنشاء...');
  try {
    const { error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: { data: { whatsapp: whatsapp } }
    });
    if (error) throw error;
    showToast('تم إنشاء الحساب بنجاح، بانتظار تفعيل الإدارة', 'success');
  } catch (e){
    showToast(mapSupabaseError(e), 'error');
  } finally {
    setBtnLoading(btn, false);
  }
}

async function onForgotSubmit(ev){
  ev.preventDefault();
  const btn = $('#forgot-submit-btn');
  const email = $('#forgot-email').value.trim();
  setBtnLoading(btn, true, 'جاري الإرسال...');
  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
    if (error) throw error;
    showToast('تم إرسال رابط إعادة التعيين إلى بريدك', 'success');
  } catch (e){
    showToast(mapSupabaseError(e), 'error');
  } finally {
    setBtnLoading(btn, false);
  }
}

async function doLogout(){
  try {
    if (ordersChannel){ supabaseClient.removeChannel(ordersChannel); ordersChannel = null; }
    await supabaseClient.auth.signOut();
    currentStore = null;
    showToast('تم تسجيل الخروج', 'info');
  } catch (e){
    showToast(mapSupabaseError(e), 'error');
  }
}

/* ---------------------- 6. لوحة التحكم: الهيكل والتابات ---------------------- */

function renderDashboard(){
  const frag = renderTemplate('tpl-dashboard');
  setRoot(frag);
  $('#topbar-store-name').textContent = (currentStore.settings && currentStore.settings.name) || 'مطعمي';
  $('#dash-logout-btn').addEventListener('click', doLogout);
  $all('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  switchTab(activeTab);
}

function switchTab(tab){
  activeTab = tab;
  $all('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'products') renderProductsTab();
  else if (tab === 'offers') renderOffersTab();
  else if (tab === 'orders') renderOrdersTab();
  else if (tab === 'settings') renderSettingsTab();
}

async function persistStore(fields){
  try {
    const { data, error } = await supabaseClient
      .from('stores')
      .update(fields)
      .eq('id', currentStore.id)
      .select()
      .maybeSingle();
    if (error) throw error;
    currentStore = data;
    return true;
  } catch (e){
    showToast(mapSupabaseError(e), 'error');
    return false;
  }
}

async function uploadImage(file, folder){
  if (!file) return null;
  if (!file.type.startsWith('image/')){
    showToast('الملف المختار ليس صورة', 'error');
    return null;
  }
  if (file.size > MAX_IMAGE_MB * 1024 * 1024){
    showToast('حجم الصورة أكبر من ' + MAX_IMAGE_MB + ' ميجابايت', 'error');
    return null;
  }
  try {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = currentStore.id + '/' + folder + '/' + uid() + '.' + ext;
    const { error } = await supabaseClient.storage.from(BUCKET_NAME).upload(path, file, { upsert: false });
    if (error) throw error;
    const { data: pub } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(path);
    return pub.publicUrl;
  } catch (e){
    showToast(mapSupabaseError(e), 'error');
    return null;
  }
}

/* ---------------------- 7. تاب المنتجات ---------------------- */

function renderProductsTab(){
  const wrap = $('#tab-content');
  wrap.innerHTML = '';

  const head = el('div', 'section-head', '<h2>المنتجات</h2>');
  const actions = el('div');
  actions.style.display = 'flex'; actions.style.gap = '8px';
  const catBtn = el('button', 'btn btn-outline btn-sm', 'إدارة التصنيفات');
  const addBtn = el('button', 'btn btn-primary btn-sm', '+ إضافة منتج');
  actions.append(catBtn, addBtn);
  head.appendChild(actions);
  wrap.appendChild(head);

  const categories = currentStore.categories || [];
  const products = currentStore.products || [];

  const chipRow = el('div', 'chip-row');
  const allChip = el('button', 'chip', 'الكل');
  chipRow.appendChild(allChip);
  categories.forEach(c => {
    chipRow.appendChild(el('span', 'chip', escapeHtml(c.name)));
  });
  wrap.appendChild(chipRow);

  if (products.length === 0){
    wrap.appendChild(el('div', 'empty-state', '<div class="icon">🍽️</div><div>لا يوجد منتجات بعد، ابدأ بإضافة أول منتج</div>'));
  } else {
    const grid = el('div', 'data-grid');
    products.forEach(p => grid.appendChild(buildProductCard(p, categories)));
    wrap.appendChild(grid);
  }

  catBtn.addEventListener('click', openCategoriesModal);
  addBtn.addEventListener('click', () => openProductModal(null));
}

function buildProductCard(p, categories){
  const cat = categories.find(c => c.id === p.category_id);
  const card = el('div', 'item-card');
  if (p.image_url){
    card.appendChild(el('img', 'thumb', '')).src = p.image_url;
  } else {
    card.appendChild(el('div', 'thumb-empty', '🍽️'));
  }
  const body = el('div', 'body');
  body.appendChild(el('div', 'name', escapeHtml(p.name)));
  body.appendChild(el('div', 'cat', cat ? escapeHtml(cat.name) : 'بدون تصنيف'));
  const priceRow = el('div', 'price-row');
  priceRow.appendChild(el('span', 'price-now', formatMoney(p.discount_price || p.price)));
  if (p.discount_price){
    priceRow.appendChild(el('span', 'price-old', formatMoney(p.price)));
  }
  body.appendChild(priceRow);
  body.appendChild(el('span', 'badge ' + (p.visible !== false ? 'badge-on' : 'badge-off'), p.visible !== false ? 'ظاهر بالمنيو' : 'مخفي'));
  card.appendChild(body);

  const actions = el('div', 'item-actions');
  const editBtn = el('button', 'btn btn-outline btn-sm', 'تعديل');
  const delBtn = el('button', 'btn btn-danger btn-sm', 'حذف');
  editBtn.addEventListener('click', () => openProductModal(p));
  delBtn.addEventListener('click', () => confirmDeleteProduct(p));
  actions.append(editBtn, delBtn);
  card.appendChild(actions);
  return card;
}

function openCategoriesModal(){
  const categories = currentStore.categories || [];
  const products = currentStore.products || [];

  const overlay = el('div', 'modal-overlay');
  const box = el('div', 'modal-box');
  box.innerHTML = '<button class="modal-close">×</button><h3>إدارة التصنيفات</h3>';

  const list = el('div');
  function renderList(){
    list.innerHTML = '';
    if (categories.length === 0){
      list.appendChild(el('div', 'empty-state', 'لا يوجد تصنيفات بعد'));
    }
    categories.forEach(c => {
      const row = el('div', 'switch-row');
      row.style.borderBottom = '1px solid #f0e6d5';
      row.appendChild(el('span', '', escapeHtml(c.name)));
      const del = el('button', 'btn btn-danger btn-sm', 'حذف');
      del.addEventListener('click', async () => {
        const used = products.some(p => p.category_id === c.id);
        if (used){
          showToast('لا يمكن حذف تصنيف مرتبط بمنتجات', 'error');
          return;
        }
        const newCats = categories.filter(x => x.id !== c.id);
        const ok = await persistStore({ categories: newCats });
        if (ok){
          showToast('تم حذف التصنيف', 'success');
          overlay.remove();
          renderProductsTab();
        }
      });
      row.appendChild(del);
      list.appendChild(row);
    });
  }
  renderList();
  box.appendChild(list);

  const form = el('form');
  form.style.marginTop = '14px';
  form.innerHTML = '<div class="field"><label>اسم تصنيف جديد</label><input type="text" id="new-cat-name" required></div>' +
    '<button type="submit" class="btn btn-primary btn-block">إضافة تصنيف</button>';
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const nameInput = $('#new-cat-name', box);
    const name = nameInput.value.trim();
    if (!name) return;
    const newCats = [...categories, { id: uid(), name }];
    const ok = await persistStore({ categories: newCats });
    if (ok){
      showToast('تمت إضافة التصنيف', 'success');
      overlay.remove();
      renderProductsTab();
    }
  });
  box.appendChild(form);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  box.querySelector('.modal-close').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

function openProductModal(product){
  const categories = currentStore.categories || [];
  const isEdit = !!product;
  const overlay = el('div', 'modal-overlay');
  const box = el('div', 'modal-box');

  let catOptions = '<option value="">بدون تصنيف</option>';
  categories.forEach(c => {
    catOptions += `<option value="${escapeHtml(c.id)}" ${product && product.category_id === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`;
  });

  box.innerHTML = `
    <button class="modal-close">×</button>
    <h3>${isEdit ? 'تعديل منتج' : 'إضافة منتج'}</h3>
    <form id="product-form">
      <div class="field">
        <label>صورة المنتج</label>
        <div class="img-upload" id="prod-img-upload">
          ${product && product.image_url ? `<img src="${escapeHtml(product.image_url)}">` : '<div style="font-size:28px">📷</div>'}
          <div class="hint">اضغط لاختيار صورة (حتى 5MB)</div>
        </div>
        <input type="file" accept="image/*" id="prod-img-input" class="hidden">
      </div>
      <div class="field">
        <label>اسم المنتج</label>
        <input type="text" id="prod-name" required value="${product ? escapeHtml(product.name) : ''}">
      </div>
      <div class="field">
        <label>الوصف</label>
        <textarea id="prod-desc" rows="2">${product ? escapeHtml(product.description || '') : ''}</textarea>
      </div>
      <div class="field">
        <label>التصنيف</label>
        <select id="prod-cat">${catOptions}</select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>السعر</label>
          <input type="number" step="0.01" min="0" id="prod-price" required value="${product ? product.price : ''}">
        </div>
        <div class="field">
          <label>السعر بعد الخصم (اختياري)</label>
          <input type="number" step="0.01" min="0" id="prod-discount" value="${product && product.discount_price ? product.discount_price : ''}">
        </div>
      </div>
      <div class="switch-row">
        <label>ظاهر بالمنيو</label>
        <div class="switch ${(!product || product.visible !== false) ? 'on' : ''}" id="prod-visible-switch"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="prod-save-btn" style="margin-top:10px">حفظ</button>
    </form>
  `;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  box.querySelector('.modal-close').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  let visible = !product || product.visible !== false;
  const visSwitch = $('#prod-visible-switch', box);
  visSwitch.addEventListener('click', () => {
    visible = !visible;
    visSwitch.classList.toggle('on', visible);
  });

  let selectedFile = null;
  const imgUpload = $('#prod-img-upload', box);
  const imgInput = $('#prod-img-input', box);
  imgUpload.addEventListener('click', () => imgInput.click());
  imgInput.addEventListener('change', () => {
    const f = imgInput.files[0];
    if (!f) return;
    selectedFile = f;
    const reader = new FileReader();
    reader.onload = () => { imgUpload.innerHTML = `<img src="${reader.result}"><div class="hint">اضغط لتغيير الصورة</div>`; };
    reader.readAsDataURL(f);
  });

  $('#product-form', box).addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = $('#prod-save-btn', box);
    setBtnLoading(btn, true, 'جاري الحفظ...');
    try {
      let imageUrl = product ? product.image_url : '';
      if (selectedFile){
        const uploaded = await uploadImage(selectedFile, 'products');
        if (uploaded) imageUrl = uploaded;
      }
      const name = $('#prod-name', box).value.trim();
      const description = $('#prod-desc', box).value.trim();
      const category_id = $('#prod-cat', box).value || null;
      const price = parseFloat($('#prod-price', box).value) || 0;
      const discountRaw = $('#prod-discount', box).value;
      const discount_price = discountRaw ? parseFloat(discountRaw) : null;

      const products = [...(currentStore.products || [])];
      if (isEdit){
        const idx = products.findIndex(p => p.id === product.id);
        if (idx > -1){
          products[idx] = { ...products[idx], name, description, category_id, price, discount_price, image_url: imageUrl, visible };
        }
      } else {
        products.push({ id: uid(), name, description, category_id, price, discount_price, image_url: imageUrl, visible });

async function confirmDeleteProduct(product){

function renderOffersTab(){

function buildOfferCard(o){
  const card = el('div', 'item-card');

  else card.appendChild(el('div', 'thumb-empty', '🎁'));

  body.appendChild(el('div', 'cat', escapeHtml(o.description || '')));
  const priceRow = el('div', 'price-row');
  priceRow.appendChild(el('span', 'price-now', formatMoney(o.price)));
  if (o.original_price) priceRow.appendChild(el('span', 'price-old', formatMoney(o.original_price)));
  body.appendChild(priceRow);
  card.appendChild(body);
  const actions = el('div', 'item-actions');
  const editBtn = el('button', 'btn btn-outline btn-sm', 'تعديل');
  const delBtn = el('button', 'btn btn-danger btn-sm', 'حذف');
  editBtn.addEventListener('click', () => openOfferModal(o));
  delBtn.addEventListener('click', async () => {
    if (!window.confirm('هل تريد حذف هذا العرض؟')) return;
    const offers = (currentStore.offers || []).filter(x => x.id !== o.id);
    const ok = await persistStore({ offers });
    if (ok){ showToast('تم حذف العرض', 'success'); renderOffersTab(); }

  actions.append(editBtn, delBtn);
  card.appendChild(actions);
  return card;
}

async function renderOrdersTab(){
  const wrap = $('#tab-content');
  wrap.innerHTML = '<div class="section-head"><h2>الطلبات</h2></div><div id="orders-list"><div class="empty-state"><div class="spinner"></div></div></div>';

  await loadOrders();
  subscribeOrdersRealtime();
}

async function loadOrders(){
  try {
    const { data, error } = await supabaseClient
      .from('orders')
      .select('*')
      .eq('store_id', currentStore.id)
      .order('created_at', { ascending: false });
    if (error) throw error;
    renderOrdersList(data || []);
  } catch (e){
    showToast(mapSupabaseError(e), 'error');
    $('#orders-list').innerHTML = '<div class="empty-state">تعذر تحميل الطلبات</div>';
  }
}

function subscribeOrdersRealtime(){
  if (ordersChannel){
    supabaseClient.removeChannel(ordersChannel);
    ordersChannel = null;
  }
  ordersChannel = supabaseClient
    .channel('orders-store-' + currentStore.id)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'orders', filter: 'store_id=eq.' + currentStore.id },
      () => { if (activeTab === 'orders') loadOrders(); }
    )
    .subscribe();
}

function renderOrdersList(orders){
  const list = $('#orders-list');
  if (!list) return;
  if (orders.length === 0){
    list.innerHTML = '<div class="empty-state"><div class="icon">🧾</div><div>لا يوجد طلبات حتى الآن</div></div>';
    return;
  }
  list.innerHTML = '';
  orders.forEach(o => list.appendChild(buildOrderCard(o)));
}

function buildOrderCard(o){
  const card = el('div', 'order-card' + (o.status === 'done' ? ' done' : ''));
  const head = el('div', 'order-head');
  head.innerHTML = `
    <div>
      <div class="name">${escapeHtml(o.customer_name)}</div>
      <div class="time">${new Date(o.created_at).toLocaleString('ar-EG')}</div>
    </div>
    <span class="badge ${o.status === 'done' ? 'badge-on' : 'badge-off'}">${o.status === 'done' ? 'تم التأكيد' : 'قيد الانتظار'}</span>
  `;
  card.appendChild(head);

  const meta = el('div', '', `
    <div style="font-size:13px;color:var(--muted)">📞 ${escapeHtml(o.customer_phone)}</div>
    <div style="font-size:13px;color:var(--muted)">${o.order_type === 'delivery' ? '🚗 توصيل' : '🏪 استلام'}${o.address ? ' — ' + escapeHtml(o.address) : ''}</div>
  `);
  card.appendChild(meta);

  const items = Array.isArray(o.items) ? o.items : [];
  const itemsHtml = items.map(it => `${escapeHtml(it.name)} × ${it.qty}`).join('<br>');
  card.appendChild(el('div', 'order-items', itemsHtml));
  card.appendChild(el('div', 'order-total', 'الإجمالي: ' + formatMoney(o.total)));

  const actions = el('div', 'order-actions');
  if (o.status !== 'done'){
    const confirmBtn = el('button', 'btn btn-success btn-sm', '✔ تأكيد وإرسال واتساب');
    confirmBtn.addEventListener('click', () => confirmOrder(o));
    actions.appendChild(confirmBtn);
  }
  const delBtn = el('button', 'btn btn-danger btn-sm', 'حذف');
  delBtn.addEventListener('click', () => deleteOrder(o));
  actions.appendChild(delBtn);
  card.appendChild(actions);

  return card;
}

async function confirmOrder(o){
  try {
    const { error } = await supabaseClient.from('orders').update({ status: 'done' }).eq('id', o.id);
    if (error) throw error;
    showToast('تم تأكيد الطلب', 'success');

    const items = Array.isArray(o.items) ? o.items : [];
    const itemsText = items.map(it => '- ' + it.name + ' x' + it.qty).join('%0A');
    const msg = `مرحبًا ${o.customer_name}، تم تأكيد طلبك:%0A${itemsText}%0Aالإجمالي: ${o.total} ج.م%0Aشكرًا لطلبك!`;
    const whatsapp = (currentStore.settings && currentStore.settings.whatsapp) || '';
    const phone = whatsapp.replace(/[^0-9]/g,'');
    if (phone){
      window.open('https://wa.me/' + phone + '?text=' + msg, '_blank');
    }
    loadOrders();
  } catch (e){
    showToast(mapSupabaseError(e), 'error');
  }
}

async function deleteOrder(o){
  if (!window.confirm('هل تريد حذف هذا الطلب؟')) return;
  try {
    const { error } = await supabaseClient.from('orders').delete().eq('id', o.id);
    if (error) throw error;
    showToast('تم حذف الطلب', 'success');
    loadOrders();
  } catch (e){
    showToast(mapSupabaseError(e), 'error');
  }
}

async function initPublicMenu(storeId){

function renderPublicMenu(){
  const frag = renderTemplate('tpl-public-menu');
  setRoot(frag);

  const s = pmStore.settings || {};
  const banner = $('#pm-banner');
  if (s.banner_url) banner.style.backgroundImage = `url('${s.banner_url}')`;

function renderOffersCarousel(){
  const offers = pmStore.offers || [];
  const wrap = $('#pm-offers-wrap');
  if (offers.length === 0) return;
  const section = el('div', 'pm-offers');
  const row = el('div', 'row');
  offers.forEach(o => {
    const card = el('div', 'offer-card');
    card.innerHTML = `
      ${o.image_url ? `<img src="${escapeHtml(o.image_url)}">` : ''}
      <div class="title">${escapeHtml(o.title)}</div>
      ${o.description ? `<div class="desc">${escapeHtml(o.description)}</div>` : ''}
      <div class="prices">
        <strong>${formatMoney(o.price)}</strong>
        ${o.original_price ? `<span style="text-decoration:line-through;opacity:.7;font-size:12px">${formatMoney(o.original_price)}</span>` : ''}
      </div>
    `;
    row.appendChild(card);
  });
  section.appendChild(row);
  wrap.appendChild(section);
}

function renderCategoryPills(){
  const categories = pmStore.categories || [];
  const row = $('#pm-cats-row');
  row.innerHTML = '';
  if (categories.length === 0){
    $('#pm-cats-wrap').classList.add('hidden');
    return;
  }
  const allPill = el('button', 'cat-pill' + (pmActiveCategory === 'all' ? ' active' : ''), 'الكل');
  allPill.addEventListener('click', () => { pmActiveCategory = 'all'; renderCategoryPills(); renderProductsByCategory(); });
  row.appendChild(allPill);
  categories.forEach(c => {
    const pill = el('button', 'cat-pill' + (pmActiveCategory === c.id ? ' active' : ''), escapeHtml(c.name));
    pill.addEventListener('click', () => { pmActiveCategory = c.id; renderCategoryPills(); renderProductsByCategory(); });
    row.appendChild(pill);
  });
}

function renderProductsByCategory(){
  const wrap = $('#pm-products-wrap');
  wrap.innerHTML = '';
  const categories = pmStore.categories || [];
  const allProducts = (pmStore.products || []).filter(p => p.visible !== false);

  if (allProducts.length === 0){
    wrap.appendChild(el('div', 'pm-empty-menu', '<div style="font-size:34px">🍽️</div><div>لا يوجد منتجات متاحة حاليًا</div>'));
    return;
  }

  function productGrid(products){
    const grid = el('div', 'pm-grid');
    products.forEach(p => grid.appendChild(buildPublicProductCard(p)));
    return grid;
  }

  if (pmActiveCategory !== 'all'){
    const filtered = allProducts.filter(p => p.category_id === pmActiveCategory);
    wrap.appendChild(productGrid(filtered));
    return;
  }

  const noCat = allProducts.filter(p => !p.category_id);
  if (noCat.length){
    wrap.appendChild(productGrid(noCat));
  }
  categories.forEach(c => {
    const inCat = allProducts.filter(p => p.category_id === c.id);
    if (inCat.length === 0) return;
    wrap.appendChild(el('div', 'pm-cat-title', escapeHtml(c.name)));
    wrap.appendChild(productGrid(inCat));
  });
}

function buildPublicProductCard(p){
  const card = el('div', 'pm-product');
  if (p.image_url) card.appendChild(el('img', 'thumb', '')).src = p.image_url;
  else card.appendChild(el('div', 'thumb-empty', '🍽️'));
  const body = el('div', 'body');
  body.appendChild(el('div', 'name', escapeHtml(p.name)));
  if (p.description) body.appendChild(el('div', 'desc', escapeHtml(p.description)));
  const foot = el('div', 'foot');
  const priceWrap = el('div');
  priceWrap.innerHTML = `<span class="price-now">${formatMoney(p.discount_price || p.price)}</span>` +
    (p.discount_price ? ` <span class="price-old">${formatMoney(p.price)}</span>` : '');
  foot.appendChild(priceWrap);

  const ctrlWrap = el('div');
  foot.appendChild(ctrlWrap);
  body.appendChild(foot);
  card.appendChild(body);

  function renderCtrl(){
    ctrlWrap.innerHTML = '';
    const inCart = cart.find(c => c.product_id === p.id);
    if (!inCart){
      const addBtn = el('button', 'qty-add', '+');
      addBtn.addEventListener('click', () => { addToCart(p); renderCtrl(); renderCartBar(); });
      ctrlWrap.appendChild(addBtn);
    } else {
      const ctrl = el('div', 'qty-ctrl');
      const minusBtn = el('button', '', '−');
      const plusBtn = el('button', '', '+');
      const qtySpan = el('span', '', String(inCart.qty));
      minusBtn.addEventListener('click', () => { changeCartQty(p, -1); renderCtrl(); renderCartBar(); });
      plusBtn.addEventListener('click', () => { changeCartQty(p, 1); renderCtrl(); renderCartBar(); });
      ctrl.append(minusBtn, qtySpan, plusBtn);
      ctrlWrap.appendChild(ctrl);
    }
  }
  renderCtrl();
  return card;
}

function addToCart(p){
  cart.push({ product_id: p.id, name: p.name, price: p.discount_price || p.price, qty: 1 });
}
function changeCartQty(p, delta){
  const idx = cart.findIndex(c => c.product_id === p.id);
  if (idx === -1) return;
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
}
function cartTotal(){
  return cart.reduce((sum, c) => sum + c.price * c.qty, 0);
}
function cartCount(){
  return cart.reduce((sum, c) => sum + c.qty, 0);
}
function renderCartBar(){
  const bar = $('#cart-bar');
  if (!bar) return;
  if (cart.length === 0){
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');
  $('#cart-count').textContent = cartCount();
  $('#cart-total-preview').textContent = formatMoney(cartTotal());
}

function openCartModal(){
  const s = pmStore.settings || {};
  const overlay = el('div', 'modal-overlay');
  const box = el('div', 'modal-box cart-modal');

  function linesHtml(){
    if (cart.length === 0) return '<div class="empty-state">السلة فارغة</div>';
    return cart.map(c => `
      <div class="cart-line" data-pid="${escapeHtml(c.product_id)}">
        <div>
          <div class="cl-name">${escapeHtml(c.name)}</div>
          <div class="cl-price">${formatMoney(c.price)} × ${c.qty}</div>
        </div>
        <div class="qty-ctrl">
          <button class="cl-minus">−</button>
          <span>${c.qty}</span>
          <button class="cl-plus">+</button>
        </div>
      </div>
    `).join('');
  }

  function summaryHtml(){
    const subtotal = cartTotal();
    const deliveryFee = (pmOrderType === 'delivery' && s.delivery_enabled) ? Number(s.delivery_fee || 0) : 0;
    const total = subtotal + deliveryFee;
    let html = `<div class="cart-summary-row"><span>المجموع الفرعي</span><span>${formatMoney(subtotal)}</span></div>`;
    if (pmOrderType === 'delivery' && s.delivery_enabled){
      html += `<div class="cart-summary-row"><span>رسوم التوصيل</span><span>${formatMoney(deliveryFee)}</span></div>`;
    }
    html += `<div class="cart-summary-row total"><span>الإجمالي</span><span>${formatMoney(total)}</span></div>`;
    return html;
  }

  function fullRender(){
    box.innerHTML = `
      <button class="modal-close">×</button>
      <h3>سلة الطلب</h3>
      <div id="cart-lines">${linesHtml()}</div>
      ${cart.length > 0 ? `
      <div class="order-type-toggle" id="order-type-toggle">
        <button type="button" class="ot-pickup ${pmOrderType === 'pickup' ? 'active' : ''}">🏪 استلام</button>
        <button type="button" class="ot-delivery ${pmOrderType === 'delivery' ? 'active' : ''}">🚗 توصيل</button>
      </div>
      <form id="checkout-form">
        <div class="field"><label>الاسم</label><input type="text" id="co-name" required></div>
        <div class="field"><label>رقم الهاتف</label><input type="tel" id="co-phone" required></div>
        <div class="field ${pmOrderType === 'delivery' ? '' : 'hidden'}" id="co-address-field">
          <label>العنوان</label><input type="text" id="co-address" ${pmOrderType === 'delivery' ? 'required' : ''}>
        </div>
        ${s.delivery_enabled && s.min_order && pmOrderType === 'delivery' ? `<div class="field-hint">الحد الأدنى للطلب: ${formatMoney(s.min_order)}</div>` : ''}
        <div id="cart-summary">${summaryHtml()}</div>
        <button type="submit" class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:14px">إرسال الطلب</button>
      </form>
      ` : ''}
    `;
    bindEvents();
  }

  function bindEvents(){
    box.querySelector('.modal-close').addEventListener('click', () => overlay.remove());

    $all('.cl-minus', box).forEach(b => b.addEventListener('click', (e) => {
      const pid = e.target.closest('.cart-line').dataset.pid;
      const item = cart.find(c => c.product_id === pid);
      if (item){ item.qty -= 1; if (item.qty <= 0) cart = cart.filter(c => c.product_id !== pid); }
      renderCartBar();
      fullRender();
    }));
    $all('.cl-plus', box).forEach(b => b.addEventListener('click', (e) => {
      const pid = e.target.closest('.cart-line').dataset.pid;
      const item = cart.find(c => c.product_id === pid);
      if (item) item.qty += 1;
      renderCartBar();
      fullRender();
    }));

    const toggle = $('#order-type-toggle', box);
    if (toggle){
      toggle.querySelector('.ot-pickup').addEventListener('click', () => { pmOrderType = 'pickup'; fullRender(); });
      toggle.querySelector('.ot-delivery').addEventListener('click', () => { pmOrderType = 'delivery'; fullRender(); });
    }

    const form = $('#checkout-form', box);
    if (form){
      form.addEventListener('submit', (ev) => onCheckoutSubmit(ev, box, overlay));
    }
  }

  fullRender();
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

async function onCheckoutSubmit(ev, box, overlay){
  ev.preventDefault();
  const s = pmStore.settings || {};
  const name = $('#co-name', box).value.trim();
  const phone = $('#co-phone', box).value.trim();
  const address = pmOrderType === 'delivery' ? $('#co-address', box).value.trim() : '';

  if (pmOrderType === 'delivery' && !address){
    showToast('من فضلك أدخل عنوان التوصيل', 'error');
    return;
  }
  const subtotal = cartTotal();
  const deliveryFee = (pmOrderType === 'delivery' && s.delivery_enabled) ? Number(s.delivery_fee || 0) : 0;

  if (pmOrderType === 'delivery' && s.delivery_enabled && s.min_order && subtotal < Number(s.min_order)){
    showToast('الحد الأدنى للطلب هو ' + formatMoney(s.min_order), 'error');
    return;
  }

  const btn = $('#checkout-btn', box);
  setBtnLoading(btn, true, 'جاري الإرسال...');
  try {
    const { error } = await supabaseClient.from('orders').insert({
      store_id: pmStoreId,
      customer_name: name,
      customer_phone: phone,
      order_type: pmOrderType,
      address: address,
      items: cart.map(c => ({ product_id: c.product_id, name: c.name, price: c.price, qty: c.qty })),
      total: subtotal + deliveryFee,
      delivery_fee: deliveryFee,
      status: 'pending'
    });
    if (error) throw error;

    box.innerHTML = `
      <button class="modal-close">×</button>
      <div class="success-check">
        <div class="icon">✅</div>
        <h3>تم إرسال طلبك بنجاح</h3>
        <p style="color:var(--muted);margin-top:8px">سيتم التواصل معك قريبًا لتأكيد الطلب</p>
        <button class="btn btn-primary btn-block" id="success-close-btn" style="margin-top:16px">تم</button>
      </div>
    `;
    box.querySelector('.modal-close').addEventListener('click', () => { overlay.remove(); });
    $('#success-close-btn', box).addEventListener('click', () => overlay.remove());

    cart = [];
    renderCartBar();
  } catch (e){
    showToast(mapSupabaseError(e), 'error');
  } finally {
    setBtnLoading(btn, false);
  }
}

</script>
</body>
</html>
